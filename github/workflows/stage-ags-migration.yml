
name: Stage AGS website migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout school's repository
        uses: actions/checkout@v4
        with:
          path: destination
          ref: main

      - name: Checkout current AGS website
        uses: actions/checkout@v4
        with:
          repository: fidelnyame-80/ags-edu
          ref: master
          path: source
          persist-credentials: false

      - name: Verify migration branch is unused
        working-directory: destination
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/migration/ags-website; then
            echo "Migration branch already exists. Stopping."
            exit 1
          fi

      - name: Prepare migration snapshot
        run: |
          cd destination
          git switch -c migration/ags-website
          cd ..
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' source/ destination/

      - name: Commit and push snapshot
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to migrate."
            exit 1
          fi
          git commit -m "Stage AGS website source for migration"
          git push origin HEAD:refs/heads/migration/ags-website
